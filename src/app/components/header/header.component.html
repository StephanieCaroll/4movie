<ion-header class="ion-no-border premium-header">
  <ion-toolbar class="main-toolbar">
    <ion-buttons slot="start">
      <ion-menu-button color="light"></ion-menu-button>
    </ion-buttons>

    <div class="mobile-search-container">
      <ion-searchbar 
        [(ngModel)]="searchQuery"
        (ionInput)="onSearchChange($event)"
        placeholder="Buscar..."
        class="mobile-searchbar">
      </ion-searchbar>
    </div>

    <div class="logo-wrapper mobile-logo-right" routerLink="/">
      <span class="logo-main">4<span class="logo-accent">MOVIE</span></span>
    </div>

    <ion-buttons slot="end" class="header-actions-group hide-on-mobile">
      <ion-button class="header-icon-btn" routerLink="/categories">
        <ion-icon slot="icon-only" name="grid-outline"></ion-icon>
      </ion-button>
      
      <ion-button class="header-icon-btn" routerLink="/login">
        <ion-icon slot="icon-only" name="person-outline"></ion-icon>
      </ion-button>

      <ion-button class="header-icon-btn cart-btn" routerLink="/cart">
        <ion-icon slot="icon-only" name="cart-outline"></ion-icon>
        <span class="badge-dot" *ngIf="itemCount > 0">{{ itemCount }}</span>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>

  <ion-toolbar class="search-toolbar desktop-search">
    <ion-searchbar 
      [(ngModel)]="searchQuery"
      (ionInput)="onSearchChange($event)"
      placeholder="Buscar no 4movie..."
      class="app-searchbar">
    </ion-searchbar>
    <div class="search-underline" [class.active]="searchQuery.length > 0"></div>
  </ion-toolbar>
</ion-header>

<div class="search-results-overlay" *ngIf="isSearching && searchQuery.length > 0">
  <div class="search-header">
    <h2 class="search-title">Resultados para "{{ searchQuery }}"</h2>
    <ion-button fill="clear" color="light" (click)="closeSearch()">Fechar</ion-button>
  </div>

  <div class="search-grid" *ngIf="searchResults.length > 0">
    <div class="movie-card" *ngFor="let movie of searchResults" (click)="navigateToMovie(movie.id)">
      <div class="poster-container">
        <img [src]="imageBaseUrl + movie.poster_path" [alt]="movie.title" *ngIf="movie.poster_path" draggable="false" />
        <div class="no-image" *ngIf="!movie.poster_path">Sem Imagem</div>
        <div class="card-badge">★ {{ movie.vote_average?.toFixed(1) }}</div>
      </div>
      <p class="movie-grid-title">{{ movie.title }}</p>
    </div>
  </div>

  <div class="no-results" *ngIf="searchResults.length === 0 && searchQuery.length > 0">
    <p>Nenhum título encontrado para "{{ searchQuery }}"</p>
  </div>
</div>
