<app-header [itemCount]="itemCount"></app-header>

<ion-content class="ion-padding crimson-bg">
  <div class="signup-container">
    <div class="signup-card">
      
      <!-- Cabeçalho com Destaque Vermelho -->
      <div class="card-header">
       
        <h1 class="title">4<span class="crimson-text">MOVIE</span></h1>
        <p class="subtitle">Junte-se à melhor experiência de cinema</p>
        <div class="red-divider"></div>
      </div>

      <!-- Formulário -->
      <form (ngSubmit)="cadastrar()">
        <ion-grid class="ion-no-padding">
          <!-- Nome Completo -->
          <ion-row>
            <ion-col size="12">
              <div class="input-wrapper">
                <ion-icon name="person-outline" class="input-icon"></ion-icon>
                <ion-input
                  type="text"
                  [(ngModel)]="nome"
                  name="nome"
                  placeholder="Nome Completo"
                  class="crimson-input">
                </ion-input>
              </div>
            </ion-col>
          </ion-row>

          <!-- Email -->
          <ion-row>
            <ion-col size="12">
              <div class="input-wrapper">
                <ion-icon name="mail-outline" class="input-icon"></ion-icon>
                <ion-input
                  type="email"
                  [(ngModel)]="email"
                  name="email"
                  placeholder="E-mail"
                  class="crimson-input">
                </ion-input>
              </div>
            </ion-col>
          </ion-row>

          <!-- Telefone -->
          <ion-row>
            <ion-col size="12">
              <div class="input-wrapper">
                <ion-icon name="call-outline" class="input-icon"></ion-icon>
                <ion-input
                  type="tel"
                  [(ngModel)]="telefone"
                  name="telefone"
                  placeholder="Telemóvel"
                  class="crimson-input">
                </ion-input>
              </div>
            </ion-col>
          </ion-row>

          <!-- Senha -->
          <ion-row>
            <ion-col size="12">
              <div class="input-wrapper">
                <ion-icon name="lock-closed-outline" class="input-icon"></ion-icon>
                <ion-input
                  type="password"
                  [(ngModel)]="senha"
                  name="senha"
                  placeholder="Palavra-passe"
                  class="crimson-input">
                </ion-input>
              </div>
            </ion-col>
          </ion-row>

          <!-- Confirmar Senha -->
          <ion-row>
            <ion-col size="12">
              <div class="input-wrapper">
                <ion-icon name="checkmark-done-circle-outline" class="input-icon"></ion-icon>
                <ion-input
                  type="password"
                  [(ngModel)]="confirmarSenha"
                  name="confirmarSenha"
                  placeholder="Confirmar Palavra-passe"
                  class="crimson-input">
                </ion-input>
              </div>
            </ion-col>
          </ion-row>
        </ion-grid>

        <!-- Mensagem de erro de senha -->
        <div *ngIf="senha && confirmarSenha && senha !== confirmarSenha" class="error-message">
          <ion-icon name="alert-circle-outline"></ion-icon>
          <span>As palavras-passe não coincidem</span>
        </div>

        <!-- Botão Registrar -->
        <ion-button 
          expand="block" 
          type="submit"
          class="register-btn"
          [disabled]="senha !== confirmarSenha || !nome || !email || !senha">
          <span>CRIAR CONTA</span>
          <ion-icon name="arrow-forward-outline" slot="end"></ion-icon>
        </ion-button>

        <!-- Link para Login -->
        <div class="footer-links">
          <span class="gray-text">Já tem uma conta?</span>
          <ion-button fill="clear" (click)="voltarParaLogin()" class="login-link">
            Entrar <ion-icon name="log-in-outline"></ion-icon>
          </ion-button>
        </div>
      </form>
    </div>
  </div>
</ion-content>
