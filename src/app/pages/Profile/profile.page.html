<app-header [itemCount]="itemCount"></app-header>

<ion-content class="crimson-bg">
  <div class="profile-container" *ngIf="usuario">

    <div class="foto-area">
      <div class="avatar-wrapper">
        <img src="https://ionicframework.com/docs/img/demos/avatar.svg" alt="Foto de perfil" class="foto-perfil">
        <div class="edit-badge">
          <ion-icon name="camera"></ion-icon>
        </div>
      </div>
    </div>

    <div class="dados-usuario">
      <h1 class="user-name">{{ usuario.name }}</h1>
      <p class="user-email">{{ usuario.email }}</p>

      <div class="action-buttons">
        <ion-button fill="solid" class="edit-btn">
          <ion-icon name="create-outline" slot="start"></ion-icon>
          Editar Dados
        </ion-button>
        
        <ion-button fill="outline" color="danger" class="logout-btn" (click)="sair()">
          <ion-icon name="log-out-outline" slot="start"></ion-icon>
          Sair
        </ion-button>
      </div>
    </div>

    <div class="menu-area">
      <ion-list lines="none" class="transparent-list">
        <ion-item button detail="true">
          <ion-icon name="play-circle-outline" slot="start"></ion-icon>
          <ion-label>Continuar a assistir</ion-label>
        </ion-item>
        
        <ion-item button detail="true">
          <ion-icon name="time-outline" slot="start"></ion-icon>
          <ion-label>Assistir mais tarde</ion-label>
        </ion-item>
        
        <ion-item button detail="true">
          <ion-icon name="heart" slot="start" color="danger"></ion-icon>
          <ion-label>Meus Favoritos</ion-label>
        </ion-item>
      </ion-list>
    </div>

  </div>
</ion-content>
