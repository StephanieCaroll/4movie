<ion-header>
  <ion-toolbar>
    <ion-title>
      <span class="titulo-branco">4</span>
      <span class="titulo-vermelho">MOVIE</span>
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="perfil-container">
    
    <img
      src="https://ionicframework.com/docs/img/demos/avatar.svg"
      alt="Foto Perfil"
      class="foto-perfil"
    >

    <h2 class="nome-usuario">
      Usuário
    </h2>

    <p class="email-usuario">
      usuario@email.com
    </p>

  </div>
  
  <ion-list>

    <ion-item button>
      <ion-icon name="heart-outline" slot="start"></ion-icon>
      <ion-label>Favoritos</ion-label>
    </ion-item>

    <ion-item button>
      <ion-icon name="create-outline" slot="start"></ion-icon>
      <ion-label>Editar Dados</ion-label>
    </ion-item>

    <ion-item button>
      <ion-icon name="time-outline" slot="start"></ion-icon>
      <ion-label>Assistir Mais Tarde</ion-label>
    </ion-item>

  </ion-list>
</ion-content>
