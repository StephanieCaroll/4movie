
<ion-content class="app-background">
 
  <div class="main-sections-container">
    
    <section class="content-wrapper" *ngFor="let genre of genres">
      <div class="section-title">
        <h2>{{ genre.name }}</h2>
        <span class="see-all" [routerLink]="['/genre', genre.id]">Ver tudo</span>
      </div>

      <div class="horizontal-scroll">
        <div class="movie-card" 
             *ngFor="let movie of genre.movies" 
             (click)="goToMovieDetails($event, movie.id)">
          <div class="poster-container">
            <img 
              [src]="imageBaseUrl + movie.poster_path" 
              [alt]="movie.title" 
              draggable="false"
              (error)="movie.poster_path = null" />
            <div class="no-image" *ngIf="!movie.poster_path">
              <ion-icon name="image-outline"></ion-icon>
              <span>Sem imagem</span>
            </div>
            <div class="card-badge" *ngIf="movie.vote_average > 0">
              ★ {{ movie.vote_average.toFixed(1) }}
            </div>
          </div>
          <p class="movie-title">{{ movie.title }}</p>
        </div>
      </div>
    </section>

  </div>
</ion-content>
